services:
  - type: web
    name: plastitrace
    runtime: static
    buildCommand: "npm run check"
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /app.js
        name: Cache-Control
        value: no-cache
      - path: /styles.css
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
